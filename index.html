<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Burger Rank Cartago</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #1D1D1D;
  color: white;
}

/* NAV */
header {
  display: flex;
  justify-content: space-between;
  align-items: center; /* Alinea verticalmente el logo y los botones */
  padding: 20px;
  background: black;
}

/* Estilo de los botones del menú */
nav a {
  margin: 0 5px;
  color: #000; /* Texto negro para que resalte sobre el dorado */
  text-decoration: none;
  background-color: #FFD700; /* Color solicitado */
  padding: 8px 15px;
  border-radius: 20px; /* Forma redondeada de botón */
  font-weight: 600;
  font-size: 14px;
  transition: background 0.3s ease, transform 0.2s;
  display: inline-block;
}

/* Efecto al pasar el mouse por el menú */
nav a:hover {
  background-color: #e6c200; /* Un dorado un poco más oscuro */
  transform: scale(1.05);
}

/* HERO */
#inicio {
  padding: 80px;
  background: linear-gradient(to right, #000, #1D1D1D);
}

#inicio h2 {
  font-size: 50px;
  color: #E63946;
}

/* Estilo general para botones de acción (Login, Guardar, etc) */
button {
  background: #E63946;
  color: white;
  border: none;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
}

button:hover {
  background: #F4A261;
}

/* CARDS */
.cards {
  display: flex;
  gap: 20px;
  padding: 20px;
}

.card {
  background: #2a2a2a;
  padding: 15px;
  border-radius: 10px;
  width: 200px;
}

/* SECCIONES */
section {
  padding: 40px;
}

input, textarea {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
}

</style>
</head>

<body>

<header>
  <h1>🍔 Burger Rank</h1>
  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#ranking">Ranking</a>
    <a href="#resenas">Reseñas</a>
    <a href="#mapa">Mapa</a>
    <a href="#acerca">Acerca</a>
  </nav>
</header>

<section id="inicio">
  <h2>Puntuamos. Probamos. Recomendamos.</h2>
  <p>Descubre las mejores hamburguesas de Cartago</p>
</section>

<section>
  <h2>Login</h2>
  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="register()">Registrarse</button>
  <button onclick="login()">Entrar</button>
</section>

<section id="ranking">
  <h2>Ranking</h2>
  <ul id="lista"></ul>
</section>

<section>
  <h2>Agregar hamburguesa</h2>
  <input id="nombre" placeholder="Nombre">
  <input id="puntaje" type="number" placeholder="Puntaje">
  <button onclick="guardar()">Guardar</button>
</section>

<section id="resenas">
  <h2>Reseñas</h2>
  <textarea id="comentario" placeholder="Escribe algo"></textarea>
  <button onclick="guardarResena()">Publicar</button>
  <ul id="listaResenas"></ul>
</section>

<section id="mapa">
  <h2>Mapa</h2>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15914.07345686034!2d-75.91!3d4.74!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3860d9d9d9d9d9%3A0x0!2sCartago%2C%20Valle%20del%20Cauca!5e0!3m2!1ses!2sco!4v1620000000000"
  width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
</section>

<section id="acerca">
  <h2>Acerca de</h2>
  <p>Proyecto creado por Mateo, Isabela y Jean 🍔</p>
</section>

<script type="module">
// ... (Tu código de Firebase se mantiene igual)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_DOMINIO",
  projectId: "TU_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async () => {
  await createUserWithEmailAndPassword(auth, email.value, password.value);
  alert("Usuario creado");
};

window.login = async () => {
  await signInWithEmailAndPassword(auth, email.value, password.value);
  cargar();
  cargarResenas();
};

window.guardar = async () => {
  await addDoc(collection(db, "burgers"), {
    nombre: nombre.value,
    puntaje: Number(puntaje.value)
  });
  cargar();
};

async function cargar() {
  const datos = await getDocs(collection(db, "burgers"));
  lista.innerHTML = "";
  let arr = [];
  datos.forEach(doc => arr.push(doc.data()));
  arr.sort((a,b)=>b.puntaje-a.puntaje);
  arr.forEach(d => {
    lista.innerHTML += `<li>${d.nombre} ⭐ ${d.puntaje}</li>`;
  });
}

window.guardarResena = async () => {
  await addDoc(collection(db, "resenas"), {
    texto: comentario.value
  });
  cargarResenas();
};

async function cargarResenas() {
  const datos = await getDocs(collection(db, "resenas"));
  listaResenas.innerHTML = "";
  datos.forEach(doc => {
    listaResenas.innerHTML += `<li>${doc.data().texto}</li>`;
  });
}
</script>

</body>
</html>
