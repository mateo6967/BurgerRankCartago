<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Burger Rank Cartago</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #1D1D1D;
  color: white;
}

/* NAV */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  background: black;
}

nav a {
  margin: 0 5px;
  color: #000;
  text-decoration: none;
  background-color: #FFD700;
  padding: 8px 15px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 14px;
  transition: background 0.3s ease, transform 0.2s;
  display: inline-block;
}

nav a:hover {
  background-color: #e6c200;
  transform: scale(1.05);
}

/* HERO */
#inicio {
  padding: 60px 20px;
  background: linear-gradient(to bottom, #000, #1D1D1D);
  text-align: center; /* Centra todo el contenido del inicio */
}

/* ESTILO PARA TU LOGO */
.logo-img {
  max-width: 300px; /* Tamaño de la imagen */
  width: 100%;
  height: auto;
  border-radius: 50%; /* Como tu logo es circular, esto ayuda a que encaje bien */
  border: 4px solid #FFD700; /* Borde dorado para que combine */
  margin-bottom: 20px;
  box-shadow: 0px 0px 20px rgba(255, 215, 0, 0.3); /* Un pequeño brillo */
}

#inicio h2 {
  font-size: 40px;
  color: #E63946;
  margin: 10px 0;
}

/* BOTONES GENERALES */
button {
  background: #E63946;
  color: white;
  border: none;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #F4A261;
}

section {
  padding: 40px;
}

input, textarea {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
}
</style>
</head>

<body>

<header>
  <h1>🍔 Burger Rank</h1>
  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#ranking">Ranking</a>
    <a href="#resenas">Reseñas</a>
    <a href="#mapa">Mapa</a>
    <a href="#acerca">Acerca</a>
  </nav>
</header>

<section id="inicio">
  <img src="logo.jpg" alt="Burger Rank Logo" class="logo-img">
  <h2>Puntuamos. Probamos. Recomendamos.</h2>
  <p>Descubre las mejores hamburguesas de Cartago</p>
</section>

<section>
  <h2>Login</h2>
  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="register()">Registrarse</button>
  <button onclick="login()">Entrar</button>
</section>

<section id="ranking">
  <h2>Ranking</h2>
  <ul id="lista"></ul>
</section>

<section>
  <h2>Agregar hamburguesa</h2>
  <input id="nombre" placeholder="Nombre">
  <input id="puntaje" type="number" placeholder="Puntaje">
  <button onclick="guardar()">Guardar</button>
</section>

<section id="resenas">
  <h2>Reseñas</h2>
  <textarea id="comentario" placeholder="Escribe algo"></textarea>
  <button onclick="guardarResena()">Publicar</button>
  <ul id="listaResenas"></ul>
</section>

<section id="mapa">
  <h2>Mapa</h2>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15911.7259160566!2d-75.9189108!3d4.7431326!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e38699665670867%3A0x6790938f362a98f1!2sCartago%2C%20Valle%20del%20Cauca!5e0!3m2!1ses!2sco!4v1700000000000" 
  width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
</section>

<section id="acerca">
  <h2>Acerca de</h2>
  <p>Proyecto creado por Mateo, Isabela y Jean 🍔</p>
</section>

<script type="module">
// Tu lógica de Firebase aquí... (se mantiene igual)
</script>

</body>
</html>
